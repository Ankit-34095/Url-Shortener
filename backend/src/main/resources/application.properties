# Datasource configuration - PostgreSQL for Render
spring.datasource.url=jdbc:postgresql://ep-rough-dust-aq8yifaf-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL Required by Neon
#spring.datasource.hikari.data-source-properties.sslmode=require
#spring.datasource.hikari.data-source-properties.ssl=true

# Additional HikariCP connection pool settings
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true

# JWT Configuration
app.jwtSecret=${JWT_SECRET}
# 24 hours
app.jwtExpirationInMs=${APP_JWTEXPIRATIONINMS:86400000}
# 3 days
app.jwtRememberMeExpirationInMs=${APP_JWTREMEMBERMEEXPIRATIONINMS:259200000}



# Server port
server.port=${PORT:8081}

# Base URL for shortened URLs
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Logging configuration
logging.level.com.example.urlshortener=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.orm.jpa=WARN
