# Datasource configuration - PostgreSQL for Render
# Use the environment variables you already have set up
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shortener_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Additional datasource properties for better compatibility
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true

# JWT Configuration
app.jwtSecret=${APP_JWTSECRET:YourSuperSecretJWTKeyThatIsAtLeast256BitsLongAndShouldBeStoredSecurely}
# 24 hours
app.jwtExpirationInMs=${APP_JWTEXPIRATIONINMS:86400000}
# 3 days
app.jwtRememberMeExpirationInMs=${APP_JWTREMEMBERMEEXPIRATIONINMS:259200000}

# Redis Configuration (disabled for now - can be enabled with external Redis service)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Server port
server.port=${PORT:8081}

# Base URL for shortened URLs
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Logging configuration
logging.level.com.example.urlshortener=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.orm.jpa=WARN
